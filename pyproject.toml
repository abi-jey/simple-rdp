[project]
name = "simple-rdp"
version = "0.8.10"
description = "A Python RDP client for automation - exposes screen capture and input transmission"
readme = "README.md"
requires-python = ">=3.11, <3.15"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Rust", "Topic :: System :: Networking", "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",]
keywords = [ "rdp", "remote-desktop", "automation", "screen-capture",]
dependencies = [ "pyspnego>=0.12.4", "pyasn1>=0.6.5", "pillow>=13.0.0", "asn1crypto>=1.5.1", "python-dotenv>=1.2.4",]

[build-system]
requires = [ "maturin>=1.16,<2.0",]
build-backend = "maturin"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "fastmcp>=4.1.6",]
dev = [ "pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "pytest-cov>=7.1.0", "ruff>=0.17.3", "mypy>=2.4.1", "pre-commit>=4.7.0", "rich>=15.0.0", "python-docx>=1.2.0",]
docs = [ "mkdocs>=1.6.1", "mkdocs-material>=9.8.0", "mkdocstrings[python]>=1.0.8",]

[project.urls]
Homepage = "https://github.com/abi-jey/simple-rdp"
Repository = "https://github.com/abi-jey/simple-rdp"
Documentation = "https://abi-jey.github.io/simple-rdp/"

[project.scripts]
simple-rdp-mcp = "simple_rdp_mcp.server:run_server"

[tool.maturin]
python-source = "src"
module-name = "simple_rdp._rle"
include = [ "src/**/*.py",]
features = [ "pyo3/extension-module",]

[tool.ruff]
line-length = 120
target-version = "py311"
include = [ "src/**/*.py", "examples/**/*.py", "tests/**/*.py",]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
mypy_path = "src"
exclude = [ "tests/", "agents/", "simple_rdp_mcp/",]
ignore_missing_imports = true

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM",]
fixable = [ "ALL",]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = [ "tests",]
pythonpath = [ "src",]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.8.0"

[tool.poetry.group.mcp.dependencies]
fastmcp = "^4.1.6"

[tool.poetry.group.dev.dependencies]
fastapi = "^0.162.0"
maturin = "^1.16.0"
pre-commit = "^4.7.0"
langfuse = ">=4.15.6,<4.16"
openinference-instrumentation-google-adk = "^1.1.1"
litellm = ">=1.106.2,<1.106.3"

[tool.poetry.group.docs.dependencies.mkdocstrings]
extras = [ "python",]
version = "^1.0.8"

[tool.poetry.group.dev.dependencies.google-adk]
version = "^2.13.0"
